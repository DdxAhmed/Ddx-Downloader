name: Release Distributables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Distributable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm run test

      - name: Provision Bundled Binaries (yt-dlp and FFmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Write-Host "Downloading latest yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Write-Host "Downloading FFmpeg essential build..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          $ffmpegBin = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination "bin/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
          Write-Host "Binaries provisioned in bin/ successfully."

      - name: Build and Package Windows NSIS Distributable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:nsis

      - name: Verify Single Setup Executable
        shell: pwsh
        run: |
          $setupFiles = Get-ChildItem -Path "release" -Filter "Ddx-Downloader-Setup-*.exe"
          if ($setupFiles.Count -ne 1) {
            Write-Error "Validation failed: Expected exactly 1 setup executable matching 'Ddx-Downloader-Setup-*.exe', but found $($setupFiles.Count)."
            exit 1
          }
          Write-Host "Success: Verified single setup installer -> $($setupFiles[0].Name) ($([math]::Round($setupFiles[0].Length / 1MB, 2)) MB)"

      - name: Upload Setup Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ddx-Downloader-Setup
          path: release/Ddx-Downloader-Setup-*.exe
          if-no-files-found: error

      - name: Publish Single Setup to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/Ddx-Downloader-Setup-*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
