name: Release Distributables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Publish Windows Distributable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm run test

      - name: Provision Bundled Binaries (yt-dlp and FFmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Write-Host "Downloading latest yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Write-Host "Downloading FFmpeg essential build..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          $ffmpegBin = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName -Destination "bin/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
          Write-Host "Binaries provisioned in bin/ successfully."

      - name: Build and Package Windows NSIS Distributable
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:nsis -- --publish never

      - name: Validate update metadata and generated artifacts
        run: npm run validate:release

      - name: Archive complete update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ddx-Downloader-Setup
          path: |
            release/Ddx-Downloader-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Stage immutable release with all generated update artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists. Do not replace published artifacts; use a new version/tag." }
          $artifacts = Get-ChildItem -Path release -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @artifacts --draft --verify-tag --generate-notes --title "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage release" }

      - name: Verify uploaded URLs, sizes, metadata and hashes before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run validate:release -- release --github

      - name: Publish verified release (retain all older release assets)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
